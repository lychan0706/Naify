<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naify Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- 사이트 상단 제목 및 설명 -->
    <header class="page-header">
        <h1>Naify</h1>
        <p>이미지 생성 및 설정 관리</p>
    </header>

    <!-- 카드 레이아웃: PC 두 열, 모바일 한 열 -->
    <main class="settings-grid">

        <!-- 이미지 생성 옵션: 기존 ID를 유지해야 JavaScript가 정상 동작함 -->
        <section class="settings-card">
            <h2>이미지 생성 설정</h2>
            <div>
                <label for="model">생성 모델:</label>
                <select id="model">
                    <option value="nai-diffusion-4-5-full">NAI Diffusion 4.5 Full</option>
                    <option value="nai-diffusion-4-5-curated">NAI Diffusion 4.5 Curated</option>
                    <option value="nai-diffusion-5-full">NAI Diffusion 5 Full</option>
                    <option value="nai-diffusion-5-curated">NAI Diffusion 5 Curated</option>
                </select>
            </div>
            <div><label for="width">이미지 너비:</label> <input type="number" id="width" min="512" step="64" value="1216"></div>
            <div><label for="height">이미지 높이:</label> <input type="number" id="height" min="512" step="64" value="832"></div>
            <div><label for="steps">생성 단계(Steps):</label> <input type="number" id="steps" min="1" max="50" value="28"></div>
            <div><label for="prompt_guidance">프롬프트 가이던스:</label> <input type="number" id="prompt_guidance" min="0" max="10" step="0.1" value="7"></div>
            <div><label for="seed">시드(Seed):</label> <input type="number" id="seed" value="-1"></div>
            <div>
                <label for="sampler">샘플러:</label>
                <select id="sampler"><option value="k_euler_ancestral">Euler Ancestral</option></select>
            </div>
            <div><label for="prompt_guidance_rescale">가이던스 리스케일:</label> <input type="number" id="prompt_guidance_rescale" min="0" max="1" step="0.01" value="0.4"></div>
            <div>
                <label for="noise_schedule">노이즈 스케줄:</label>
                <select id="noise_schedule">
                    <option value="karras">Karras</option>
                    <option value="exponential">Exponential</option>
                    <option value="polyexponential">Polyexponential</option>
                </select>
            </div>
        </section>

        <!-- 캐시 용량은 서버 설정과 일치하도록 바이트 단위로 입력 -->
        <section class="settings-card">
            <h2>캐시 설정</h2>
            <div><label for="max_cache_size">최대 캐시 용량(바이트):</label> <input type="number" id="max_cache_size" min="1"></div>
            <div><label for="max_images">최대 이미지 개수:</label> <input type="number" id="max_images" min="1"></div>
        </section>

        <!-- 긴 프롬프트를 편하게 편집하도록 전체 너비를 차지함 -->
        <section class="settings-card full-width">
            <h2>프롬프트 설정</h2>
            <div><label for="base_prompt">기본 프롬프트:</label><br><textarea id="base_prompt" rows="8" cols="80"></textarea></div>
            <div><label for="negative_prompt">네거티브 프롬프트:</label><br><textarea id="negative_prompt" rows="8" cols="80"></textarea></div>
        </section>
    </main>

    <!-- 자주 바꾸지 않는 API 키는 페이지 맨 아래에서 필요할 때만 펼침 -->
    <details class="settings-card api-key-panel">
        <summary>NovelAI API 키 관리 <span class="summary-hint">클릭하여 펼치기</span></summary>
        <div class="api-key-panel-content">
            <p id="api-key-status" role="status">등록 상태 확인 중...</p>
            <div>
                <label for="api-key">새 API 키:</label>
                <input type="password" id="api-key" autocomplete="new-password" placeholder="새로운 NovelAI API 키 입력">
            </div>
            <button type="button" id="save-api-key">API 키 변경</button>
            <p id="api-key-save-status" role="status"></p>
        </div>
    </details>

    <!-- 스크롤 위치와 관계없이 화면 아래쪽에 떠 있는 설정 저장 버튼 -->
    <div class="save-actions">
        <p id="save-status" role="status"></p>
        <button type="button" id="save-button">설정 저장</button>
    </div>

    <script>
        // ------------------------------------------------------------
        // 1. 공통 도우미: 입력 요소 가져오기
        //    id를 넘기면 해당 입력창을 찾는다.
        // ------------------------------------------------------------
        function getInput(id) {
            const element = document.getElementById(id);
            return element;
        }

        // ------------------------------------------------------------
        // 2. 서버의 설정을 읽어 입력창에 반영
        //    GET /config는 generation, prompt, cache로 묶인 JSON을 반환한다.
        // ------------------------------------------------------------
        async function loadConfig() {
            const statusElement = getInput("save-status");

            try {
                // fetch()는 HTTP 응답을, response.json()은 JSON 본문을 비동기로 읽는다.
                const response = await fetch("/config");
                if (!response.ok) {
                    throw new Error(`설정 조회 실패: HTTP ${response.status}`);
                }
                const config = await response.json();

                // 이미지 생성 옵션 표시
                getInput("model").value = config.generation.model;
                getInput("width").value = config.generation.width;
                getInput("height").value = config.generation.height;
                getInput("steps").value = config.generation.steps;
                getInput("prompt_guidance").value = config.generation.prompt_guidance;
                getInput("seed").value = config.generation.seed;
                getInput("sampler").value = config.generation.sampler;
                getInput("prompt_guidance_rescale").value = config.generation.prompt_guidance_rescale;
                getInput("noise_schedule").value = config.generation.noise_schedule;

                // 프롬프트 및 캐시 옵션 표시
                getInput("base_prompt").value = config.prompt.base_prompt;
                getInput("negative_prompt").value = config.prompt.negative_prompt;
                getInput("max_cache_size").value = config.cache.max_cache_size;
                getInput("max_images").value = config.cache.max_images;
            } catch (error) {
                statusElement.textContent = "설정 정보를 불러오지 못했우.";
                console.error("[Naify] 설정 조회 실패:", error);
            }
        }

        // ------------------------------------------------------------
        // 3. 현재 입력창 값을 모아 NaifyConfig와 같은 JSON 구조로 만들기
        //    숫자 입력창의 .value도 문자열이므로 Number()로 변환한다.
        // ------------------------------------------------------------
        function collectConfig() {
            const config = {
                generation: {
                    model: getInput("model").value,
                    width: Number(getInput("width").value),
                    height: Number(getInput("height").value),
                    steps: Number(getInput("steps").value),
                    prompt_guidance: Number(getInput("prompt_guidance").value),
                    seed: Number(getInput("seed").value),
                    sampler: getInput("sampler").value,
                    prompt_guidance_rescale: Number(getInput("prompt_guidance_rescale").value),
                    noise_schedule: getInput("noise_schedule").value
                },
                prompt: {
                    base_prompt: getInput("base_prompt").value,
                    negative_prompt: getInput("negative_prompt").value
                },
                cache: {
                    max_cache_size: Number(getInput("max_cache_size").value),
                    max_images: Number(getInput("max_images").value)
                }
            };

            return config;
        }

        // ------------------------------------------------------------
        // 4. 설정 저장
        //    PUT /config로 전송하고, 성공했을 때만 서버의 보정값을 다시 읽는다.
        // ------------------------------------------------------------
        async function saveConfig() {
            const statusElement = getInput("save-status");
            const config = collectConfig();

            try {
                const response = await fetch("/config", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(config)
                });

                if (!response.ok) {
                    statusElement.textContent = `설정 저장 실패 (HTTP ${response.status})`;
                    return;
                }

                statusElement.textContent = "설정 저장 완료!";
                await loadConfig();
            } catch (error) {
                statusElement.textContent = "서버에 연결할 수 없우.";
                console.error("[Naify] 설정 저장 실패:", error);
            }
        }

        // ------------------------------------------------------------
        // 5. API 키 등록 여부 확인
        //    GET /secrets/status는 키 원문 대신 configured 값만 반환한다.
        // ------------------------------------------------------------
        async function loadApiKeyStatus() {
            const statusElement = getInput("api-key-status");

            try {
                const response = await fetch("/secrets/status");
                if (!response.ok) {
                    throw new Error(`API 키 상태 조회 실패: HTTP ${response.status}`);
                }
                const data = await response.json();

                if (data.configured) {
                    statusElement.textContent = "API 키가 등록되어 있우.";
                } else {
                    statusElement.textContent = "API 키가 등록되지 않았우.";
                }
            } catch (error) {
                statusElement.textContent = "API 키 등록 상태를 확인하지 못했우.";
                console.error("[Naify] API 키 상태 조회 실패:", error);
            }
        }

        // ------------------------------------------------------------
        // 6. API 키 변경
        //    입력한 키를 PUT /secrets로 전송한다. 기존 키는 조회하지 않는다.
        // ------------------------------------------------------------
        async function saveApiKey() {
            const apiKeyInput = getInput("api-key");
            const statusElement = getInput("api-key-save-status");
            const apiKey = apiKeyInput.value.trim();

            // 실수로 빈 문자열을 보내 기존 키를 지우지 않도록 막는다.
            if (apiKey.length === 0) {
                statusElement.textContent = "API 키를 입력하우.";
                return;
            }

            // Python의 NaifySecrets 모델과 동일한 필드 이름을 사용한다.
            const data = { nai_api_key: apiKey };

            try {
                const response = await fetch("/secrets", {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    statusElement.textContent = `API 키 변경 실패 (HTTP ${response.status})`;
                    return;
                }

                statusElement.textContent = "API 키가 변경되었우!";
                apiKeyInput.value = ""; // 성공 후 화면에 입력한 키를 남기지 않음
                await loadApiKeyStatus();
            } catch (error) {
                statusElement.textContent = "서버에 연결할 수 없우.";
                // 민감한 API 키 값은 콘솔에 기록하지 않는다.
                console.error("[Naify] API 키 변경 실패:", error);
            }
        }

        // ------------------------------------------------------------
        // 7. 초기화: 버튼을 연결하고 저장된 설정/키 상태를 불러오기
        // ------------------------------------------------------------
        getInput("save-button").addEventListener("click", saveConfig);
        getInput("save-api-key").addEventListener("click", saveApiKey);
        loadConfig();
        loadApiKeyStatus();
    </script>
</body>
</html>
